<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Todo List — простой список задач на JavaScript.">
    <link rel="stylesheet" href="styles.css">
    <title>Todo list</title>
</head>
<body>
    
<main class="todo-app">
    <h1>Мой список задач</h1>

    <form class="todo-form">
        <input type="text" class="todo-input" placeholder="Добавьте новую задачу" aria-label="Новая задача" maxlength="150" autocomplete="off" required>

        <button type="submit" class="todo-btn">Добавить
        </button>
    </form>

    <ul class="todo-list" aria-label="Список задач"></ul>

    <div class="todo-filters">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="active">Активные</button>
        <button class="filter-btn" data-filter="completed">Выполненные</button>
    </div>

    <div class="todo-footer">
        <span class="todo-count" aria-live="polite">Задач: 0</span>
        <button type="button" class="clear-btn">Очистить выполненные задачи</button>
    </div>
</main>

<script src="list.js"></script>

</body>
</html>
